name: ci
 
on:
  push:
    branches: [main]
  pull_request:
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build
        run: cmake --build build -j
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure
      - name: End-to-end plan (A*)
        run: ./build/ump-plan --scenario config/scenario_ridgeline.txt --planner astar
      - name: End-to-end plan (RRT*)
        run: ./build/ump-plan --scenario config/scenario_ridgeline.txt --planner rrtstar --iters 15000
 
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with ASan and UBSan
        run: >
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-asan -j
      - name: Unit tests under sanitizers
        run: ctest --test-dir build-asan --output-on-failure
